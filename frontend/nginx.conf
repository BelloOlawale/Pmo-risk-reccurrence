server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate index.html so a new build (new asset hashes) is picked
    # up on refresh; hashed assets are immutable and can be cached for a year.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router fallback: let the SPA handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # When running with Docker Compose, enable this block so the static frontend
    # can call the FastAPI backend without hardcoding an absolute URL.
    # location /api/ {
    #     proxy_pass http://web:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
